name: Hardware Windows x64

on:
  push:
    branches: [master]
  workflow_dispatch:
    inputs:
      contracts_revision:
        description: Exact Contracts Next commit
        required: true
        type: string
      simulator_revision:
        description: Exact Simulator Next commit
        required: true
        type: string

permissions:
  contents: read

jobs:
  native:
    runs-on: windows-2022
    timeout-minutes: 35
    defaults:
      run:
        shell: pwsh
        working-directory: cirnet-hardware-next
    env:
      CONTRACTS_REVISION: ${{ inputs.contracts_revision || 'b151f9f16b4d8998ca7142d208c86e7a03268694' }}
      SIMULATOR_REVISION: ${{ inputs.simulator_revision || 'bc7f23df5251cc51b2ae036f140656da5acd51cd' }}
    steps:
      - name: Validate dependency revisions and access
        working-directory: .
        env:
          DEPENDENCIES_TOKEN: ${{ secrets.CIRNET_DEPENDENCIES_READ_TOKEN || secrets.CIRNET_READ_TOKEN }}
        run: |
          if (!$env:DEPENDENCIES_TOKEN) { throw 'Set the CIRNET_DEPENDENCIES_READ_TOKEN Actions secret for cirnet-hardware-next. Grant Contents read access to cirnet-contracts-next and cirnet-simulator-next.' }
          if ($env:CONTRACTS_REVISION -cnotmatch '^[0-9a-f]{40}$') { throw 'Expected an exact Contracts Next commit.' }
          if ($env:SIMULATOR_REVISION -cnotmatch '^[0-9a-f]{40}$') { throw 'Expected an exact Simulator Next commit.' }
      - uses: actions/checkout@v5
        with:
          path: cirnet-hardware-next
          persist-credentials: false
      - uses: actions/checkout@v5
        with:
          repository: cirnetlab/cirnet-contracts-next
          ref: ${{ inputs.contracts_revision || 'b151f9f16b4d8998ca7142d208c86e7a03268694' }}
          path: cirnet-contracts-next
          token: ${{ secrets.CIRNET_DEPENDENCIES_READ_TOKEN || secrets.CIRNET_READ_TOKEN }}
          persist-credentials: false
      - uses: actions/checkout@v5
        with:
          repository: cirnetlab/cirnet-simulator-next
          ref: ${{ inputs.simulator_revision || 'bc7f23df5251cc51b2ae036f140656da5acd51cd' }}
          path: cirnet-simulator-next
          token: ${{ secrets.CIRNET_DEPENDENCIES_READ_TOKEN || secrets.CIRNET_READ_TOKEN }}
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: 26.12.1
          package-manager-cache: false
      - name: Allocate an external verification session
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          $workspace = $env:GITHUB_WORKSPACE
          $contracts = Join-Path $workspace 'cirnet-contracts-next'
          $revision = git -C $contracts rev-parse HEAD
          if ($LASTEXITCODE -or $revision -cne $env:CONTRACTS_REVISION) { throw 'Contracts checkout differs from its pin.' }
          $env:CIRNET_ARTIFACTS_CONTEXT = @{
            owner = 'cirnet-hardware-next-ci'
            roots = @((Get-Location).Path, $contracts, (Join-Path $workspace 'cirnet-simulator-next'))
          } | ConvertTo-Json -Compress
          $allocator = Join-Path $contracts 'tools/artifact-paths/cirnet_artifact_paths/artifact-paths.mjs'
          $session = node $allocator --directory (Join-Path $env:RUNNER_TEMP 'cirnet-native')
          if ($LASTEXITCODE -or !$session) { throw 'Artifact session allocation failed.' }
          "CIRNET_ARTIFACTS_SESSION=$session" >> $env:GITHUB_ENV
          "CIRNET_CONTRACTS_ROOT=$contracts" >> $env:GITHUB_ENV
          "CARGO_TARGET_DIR=$(Join-Path $session 'target')" >> $env:GITHUB_ENV
      - name: Verify and build the Windows x64 component
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          $target = 'x86_64-pc-windows-msvc'
          $ErrorActionPreference = 'Stop'
          $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio/Installer/vswhere.exe'
          $vs = & $vswhere -latest -products '*' -version '[17.0,18.0)' -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (!$vs) { throw 'Visual Studio 2022 x64 build tools are required.' }
          & (Join-Path $vs 'Common7/Tools/Launch-VsDevShell.ps1') -Arch amd64 -HostArch amd64 -SkipAutomaticLocation
          cargo fmt --all --check
          $env:CARGO_ENCODED_RUSTFLAGS = "-C$([char]31)target-feature=+crt-static"
          cargo test --locked --release --target $target
          cargo build --locked --release --target $target --bin cirnet-hardware
          $binary = Join-Path $env:CARGO_TARGET_DIR "$target/release/cirnet-hardware.exe"
          & $binary --version
          "$((Get-FileHash -LiteralPath $binary -Algorithm SHA256).Hash.ToLowerInvariant())  cirnet-hardware.exe" >> $env:GITHUB_STEP_SUMMARY
      - name: Exercise the selected Simulator worker
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          $source = Join-Path $env:GITHUB_WORKSPACE 'cirnet-simulator-next'
          $revision = git -C $source rev-parse HEAD
          if ($revision -cne $env:SIMULATOR_REVISION) { throw 'Simulator checkout differs from its pin.' }
          $build = Join-Path $env:CIRNET_ARTIFACTS_SESSION 'simulator-build'
          $install = Join-Path $env:CIRNET_ARTIFACTS_SESSION 'simulator'
          cmake -S $source -B $build -G 'Visual Studio 17 2022' -A x64
          cmake --build $build --config Release
          cmake --install $build --config Release --prefix $install
          $env:CIRNET_SIM_CPP_WORKER = Join-Path $install 'bin/cirnet-simulator-worker.exe'
          $env:CIRNET_SIM_CPP_WORKER_SHA256 = (Get-FileHash -LiteralPath $env:CIRNET_SIM_CPP_WORKER -Algorithm SHA256).Hash.ToLowerInvariant()
          $env:CARGO_ENCODED_RUSTFLAGS = "-C$([char]31)target-feature=+crt-static"
          cargo test --locked --release --target x86_64-pc-windows-msvc --test simulator_parity -- --ignored
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - name: Verify native Hardware RPC lifecycle
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio/Installer/vswhere.exe'
          $vs = & $vswhere -latest -products '*' -version '[17.0,18.0)' -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (!$vs) { throw 'Visual Studio 2022 x64 build tools are required.' }
          & (Join-Path $vs 'Common7/Tools/Launch-VsDevShell.ps1') -Arch amd64 -HostArch amd64 -SkipAutomaticLocation
          $session = $env:CIRNET_ARTIFACTS_SESSION
          $env:CIRNET_RPC_STALE_WORKER = Join-Path $session 'stale-worker.exe'
          rustc --edition=2024 --target x86_64-pc-windows-msvc -C target-feature=+crt-static tests/rpc/fixtures/stale_worker.rs -o $env:CIRNET_RPC_STALE_WORKER
          $venv = Join-Path $session 'rpc-venv'
          python -m venv $venv
          $python = Join-Path $venv 'Scripts/python.exe'
          & $python -m pip install --only-binary=:all: --require-hashes -r requirements-verification.lock
          $cargo = cargo metadata --locked --offline --filter-platform x86_64-pc-windows-msvc --format-version 1 | ConvertFrom-Json
          $compiler = @($cargo.packages | Where-Object { $_.name -eq 'protoc-bin-vendored-win32' })
          if ($compiler.Count -ne 1) { throw 'Expected one Cargo-locked Windows protoc package.' }
          $protoc = Join-Path (Split-Path $compiler[0].manifest_path -Parent) 'bin/protoc.exe'
          $proto = Join-Path $env:CIRNET_CONTRACTS_ROOT 'contracts/hardware/v2'
          $bindings = Join-Path $session 'rpc-bindings'
          New-Item -Path $bindings -ItemType Directory | Out-Null
          & $protoc "--proto_path=$proto" "--python_out=$bindings" (Join-Path $proto 'rpc_v2.proto')
          $env:PYTHONPATH = $bindings
          $env:CIRNET_NATIVE_HARDWARE = Join-Path $env:CARGO_TARGET_DIR 'x86_64-pc-windows-msvc/release/cirnet-hardware.exe'
          $env:CIRNET_NATIVE_HARDWARE_SHA256 = (Get-FileHash -LiteralPath $env:CIRNET_NATIVE_HARDWARE -Algorithm SHA256).Hash.ToLowerInvariant()
          $env:CIRNET_SIM_CPP_WORKER = Join-Path $session 'simulator/bin/cirnet-simulator-worker.exe'
          $env:CIRNET_SIM_CPP_WORKER_SHA256 = (Get-FileHash -LiteralPath $env:CIRNET_SIM_CPP_WORKER -Algorithm SHA256).Hash.ToLowerInvariant()
          $env:CIRNET_WINDOWS_PREPARED_PREVIEW = '1'
          & $python -B -m pytest -p no:cacheprovider --basetemp (Join-Path $session 'rpc-pytest') tests/rpc
