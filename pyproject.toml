[build-system]
requires = ["setuptools==84.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "cirnet-hardware-service"
version = "0.1.2"
description = "Safety-gated local hardware RPC and virtual stations for CIRNET"
readme = "README.md"
requires-python = ">=3.11"
license-files = ["LICENSE"]
dependencies = [
  "cirnet-contracts==0.1.2",
  "cirnet-simulator==0.1.2",
  "grpcio==1.84.0",
  "protobuf==7.36.2",
  "jsonschema==4.26.0"
]

[project.urls]
Repository = "https://github.com/cirnetlab/cirnet-hardware"
Documentation = "https://github.com/cirnetlab/cirnet-hardware/blob/master/README.md"

[project.optional-dependencies]
test = ["pytest==9.1.1"]

[tool.setuptools.packages.find]
include = ["hardware_service*"]
namespaces = false

[tool.pytest.ini_options]
addopts = "-p no:cacheprovider --import-mode=prepend"
testpaths = ["tests"]
